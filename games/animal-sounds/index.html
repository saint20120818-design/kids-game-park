<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#8eddf1">
  <meta name="description" content="點點可愛的立體動物，聽聽牠們怎麼叫。">
  <title>動物聲音島｜點點動物聽聲音</title>
  <style>
    :root{--ink:#29445a;--sky:#8eddf1;--cream:#fff9e9;--orange:#ff826b}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;min-height:100%;margin:0;overflow-x:hidden}
    body{background:linear-gradient(#8eddf1 0 44%,#83ce67 44% 100%);color:var(--ink);font-family:Arial,"Noto Sans TC",sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
    button{font:inherit;color:inherit;touch-action:manipulation}
    .island{position:relative;min-height:100svh;max-width:760px;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));overflow:hidden}
    .sun{position:absolute;right:24px;top:70px;width:68px;height:68px;border-radius:50%;background:#ffe66e;box-shadow:0 0 0 12px #ffe66e44}
    .cloud{position:absolute;width:105px;height:29px;border-radius:40px;background:#ffffffaa}
    .cloud::before,.cloud::after{content:"";position:absolute;bottom:0;border-radius:50%;background:inherit}
    .cloud::before{left:18px;width:43px;height:43px}.cloud::after{right:12px;width:55px;height:55px}
    .c1{left:-34px;top:104px;transform:scale(.72)}.c2{right:-29px;top:178px;transform:scale(.52)}
    header{position:relative;z-index:4;text-align:center}
    .brand{display:inline-flex;align-items:center;gap:8px;margin:0;padding:7px 15px;border:4px solid white;border-radius:19px;background:#ff826b;color:white;font-size:clamp(23px,7vw,34px);font-weight:1000;line-height:1;box-shadow:0 6px 0 #ca5648;text-shadow:0 2px #ae463b}
    .brand i{font-style:normal;animation:music 1.2s ease-in-out infinite alternate}
    .guide{display:block;width:max-content;max-width:92%;margin:11px auto 0;padding:7px 14px;border-radius:99px;background:#ffffffdf;color:#347c91;font-size:14px;font-weight:1000;box-shadow:0 4px 0 #57abc0}
    .stage{position:relative;z-index:2;height:clamp(280px,43svh,405px);margin:11px 0 8px;border:4px solid #ffffffbb;border-radius:32px;background:linear-gradient(#b9eff9aa 0 64%,#79c85eaa 64%);box-shadow:0 10px 0 #3d934f55;overflow:hidden}
    .stage::after{content:"";position:absolute;z-index:0;left:-10%;right:-10%;bottom:-48px;height:135px;border-radius:50% 50% 0 0;background:#69b953}
    #scene{position:absolute;z-index:1;inset:0;cursor:pointer;touch-action:manipulation}
    #scene canvas{display:block;width:100%;height:100%}
    .animal-name{position:absolute;z-index:4;left:14px;top:14px;min-width:90px;padding:8px 14px;border-radius:16px;background:#fffdf0;color:#38566b;font-size:20px;font-weight:1000;text-align:center;box-shadow:0 5px 0 #d9c98d}
    .sound-button{position:absolute;z-index:5;right:14px;top:14px;display:grid;place-items:center;width:82px;height:82px;padding:0;border:4px solid white;border-radius:50%;background:#ff806b;color:white;cursor:pointer;box-shadow:0 7px 0 #c95347}
    .sound-button span{font-size:36px;line-height:1}.sound-button small{font-size:11px;font-weight:1000}
    .sound-button:active{transform:translateY(6px);box-shadow:0 1px 0 #c95347}
    .sound-button.playing{animation:pop .42s ease}.sound-button.playing span{animation:wiggle .32s ease 2}
    .speech{position:absolute;z-index:5;left:50%;bottom:13px;min-width:120px;max-width:72%;padding:9px 17px;border:4px solid white;border-radius:23px;background:#fff8dd;color:#e16751;font-size:22px;font-weight:1000;text-align:center;box-shadow:0 5px 0 #d9b85d;transform:translateX(-50%);opacity:0;transition:.16s}
    .speech.show{opacity:1;transform:translateX(-50%) translateY(-4px) scale(1.04)}
    .animals{position:relative;z-index:4;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .animal-button{min-width:0;min-height:72px;padding:6px 3px;border:3px solid white;border-radius:18px;background:var(--card);font-weight:1000;cursor:pointer;box-shadow:0 5px 0 var(--shadow);transition:.12s}
    .animal-button span{display:block;font-size:31px;line-height:1.05}.animal-button small{display:block;margin-top:3px;font-size:13px}
    .animal-button:active,.animal-button.active{transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
    .animal-button.active{outline:4px solid #ff765e;outline-offset:1px}
    .animal-button:focus-visible,.sound-button:focus-visible{outline:5px solid #255fd0;outline-offset:3px}
    .tip{position:relative;z-index:3;margin:10px 0 0;text-align:center;color:#f5ffed;font-size:12px;font-weight:900;text-shadow:0 2px #438837}
    @keyframes music{to{transform:rotate(12deg) scale(1.15)}}@keyframes wiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg) scale(1.12)}}@keyframes pop{50%{transform:scale(1.12)}}
    @media(max-height:700px){.island{padding-top:7px}.brand{font-size:22px}.guide{margin-top:7px;padding-block:5px}.stage{height:325px;margin-top:7px}.animal-button{min-height:60px}.animal-button span{font-size:27px}.tip{display:none}}
    @media(min-width:700px){.animals{gap:12px}.animal-button{min-height:82px}.animal-button span{font-size:38px}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="island">
    <div class="sun" aria-hidden="true"></div><div class="cloud c1" aria-hidden="true"></div><div class="cloud c2" aria-hidden="true"></div>
    <header>
      <h1 class="brand"><i>♪</i>動物聲音島</h1>
      <p class="guide">點動物，聽聽牠怎麼叫！</p>
    </header>
    <section class="stage" aria-label="立體動物聲音舞台">
      <div id="scene" role="button" tabindex="0" aria-label="點擊立體小狗播放叫聲"></div>
      <div class="animal-name" aria-live="polite">🐶 小狗</div>
      <button class="sound-button" aria-label="播放小狗叫聲"><span aria-hidden="true">🔊</span><small>聽聲音</small></button>
      <div class="speech" role="status" aria-live="polite">汪汪汪！</div>
    </section>
    <nav class="animals" aria-label="選擇動物">
      <button class="animal-button active" data-animal="dog" style="--card:#ffd6ae;--shadow:#d99a5f"><span>🐶</span><small>小狗</small></button>
      <button class="animal-button" data-animal="cat" style="--card:#d9ddeb;--shadow:#9da4bd"><span>🐱</span><small>小貓</small></button>
      <button class="animal-button" data-animal="cow" style="--card:#f1eee7;--shadow:#aaa69e"><span>🐮</span><small>乳牛</small></button>
      <button class="animal-button" data-animal="duck" style="--card:#ffe797;--shadow:#d5ae3e"><span>🐤</span><small>小鴨</small></button>
      <button class="animal-button" data-animal="sheep" style="--card:#f4e9d8;--shadow:#c2ad91"><span>🐑</span><small>小羊</small></button>
      <button class="animal-button" data-animal="pig" style="--card:#ffcbd7;--shadow:#d58b9d"><span>🐷</span><small>小豬</small></button>
      <button class="animal-button" data-animal="frog" style="--card:#c4ed9c;--shadow:#87bd56"><span>🐸</span><small>青蛙</small></button>
      <button class="animal-button" data-animal="rooster" style="--card:#ffcab5;--shadow:#d9896c"><span>🐓</span><small>公雞</small></button>
    </nav>
    <p class="tip">可以點大動物、喇叭，或下方任一動物按鈕</p>
  </main>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js';

    const animals={
      dog:{name:'小狗',emoji:'🐶',sound:'汪汪汪！',color:0xd98d4a,pitch:1.05,rate:.72},
      cat:{name:'小貓',emoji:'🐱',sound:'喵～喵～',color:0xa8afbd,pitch:1.35,rate:.65},
      cow:{name:'乳牛',emoji:'🐮',sound:'哞～～',color:0xf7f5ee,pitch:.55,rate:.5},
      duck:{name:'小鴨',emoji:'🐤',sound:'呱呱呱！',color:0xf6c945,pitch:1.55,rate:.82},
      sheep:{name:'小羊',emoji:'🐑',sound:'咩～～咩～～',color:0xf4eee1,pitch:1.15,rate:.58},
      pig:{name:'小豬',emoji:'🐷',sound:'齁齁！齁齁！',color:0xf3a3ad,pitch:.82,rate:.72},
      frog:{name:'青蛙',emoji:'🐸',sound:'呱！呱！呱！',color:0x6fbd52,pitch:.9,rate:.82},
      rooster:{name:'公雞',emoji:'🐓',sound:'咕咕咕！',color:0xf2c98b,pitch:1.25,rate:.7}
    };
    let current='dog',speakingTimer;
    const mount=document.querySelector('#scene'),nameBox=document.querySelector('.animal-name'),speech=document.querySelector('.speech'),soundButton=document.querySelector('.sound-button');
    const buttons=[...document.querySelectorAll('[data-animal]')];

    function speak(id){
      current=id;
      const animal=animals[id];
      buttons.forEach(button=>button.classList.toggle('active',button.dataset.animal===id));
      nameBox.textContent=animal.emoji+' '+animal.name;
      speech.textContent=animal.sound;speech.classList.add('show');
      mount.setAttribute('aria-label',`點擊立體${animal.name}播放叫聲`);
      soundButton.setAttribute('aria-label',`播放${animal.name}叫聲`);
      soundButton.classList.remove('playing');void soundButton.offsetWidth;soundButton.classList.add('playing');
      showAnimal(id);
      speechSynthesis.cancel();
      const voice=new SpeechSynthesisUtterance(animal.sound);
      voice.lang='zh-TW';voice.rate=animal.rate;voice.pitch=animal.pitch;voice.volume=1;
      speechSynthesis.speak(voice);
      clearTimeout(speakingTimer);speakingTimer=setTimeout(()=>{speech.classList.remove('show');soundButton.classList.remove('playing')},1500);
    }
    buttons.forEach(button=>button.addEventListener('click',()=>speak(button.dataset.animal)));
    soundButton.addEventListener('click',()=>speak(current));
    mount.addEventListener('click',()=>speak(current));
    mount.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();speak(current)}});

    const mat=color=>new THREE.MeshStandardMaterial({color,roughness:.76});
    function sphere(color,scale,position){
      const mesh=new THREE.Mesh(new THREE.SphereGeometry(.62,28,20),mat(color));
      mesh.scale.set(...scale);mesh.position.set(...position);mesh.castShadow=true;return mesh;
    }
    function cone(color,position,rotationZ=0,scale=[1,1,1]){
      const mesh=new THREE.Mesh(new THREE.ConeGeometry(.3,.7,5),mat(color));
      mesh.position.set(...position);mesh.rotation.z=rotationZ;mesh.scale.set(...scale);mesh.castShadow=true;return mesh;
    }
    function eyes(group,y=1.25,z=.55,spread=.24,size=.1){
      [-spread,spread].forEach(x=>{group.add(sphere(0x24303c,[size,size*1.3,.08],[x,y,z]));group.add(sphere(0xffffff,[.025,.032,.018],[x-.025,y+.035,z+.05]))});
    }
    function baseAnimal(id){
      const data=animals[id],group=new THREE.Group();group.userData.id=id;
      group.add(sphere(data.color,[.9,.8,.72],[0,.48,0]),sphere(data.color,[.76,.74,.7],[0,1.2,.04]));
      [-.43,.43].forEach(x=>group.add(sphere(data.color,[.22,.55,.22],[x,.02,0])));
      return group;
    }
    function makeAnimal(id){
      const g=baseAnimal(id);
      if(id==='dog'){eyes(g);g.add(sphere(0x9e5f31,[.27,.68,.17],[-.58,1.18,0]),sphere(0x9e5f31,[.27,.68,.17],[.58,1.18,0]),sphere(0x6f4128,[.18,.14,.13],[0,1.03,.64]))}
      if(id==='cat'){eyes(g);g.add(cone(0x838d9c,[-.43,1.74,0],-.12),cone(0x838d9c,[.43,1.74,0],.12),sphere(0xe7848e,[.11,.08,.08],[0,1.06,.64]))}
      if(id==='cow'){eyes(g);g.add(sphere(0x44454b,[.3,.26,.08],[-.32,1.42,.45]),sphere(0x44454b,[.22,.2,.07],[.39,1.01,.54]),cone(0xe7c58d,[-.58,1.65,0],-.85),cone(0xe7c58d,[.58,1.65,0],.85),sphere(0xe9a8aa,[.43,.22,.18],[0,.98,.59]))}
      if(id==='duck'){eyes(g,1.31,.55,.2,.08);const beak=cone(0xf28b32,[0,1.08,.78],0,[1.05,1.3,.8]);beak.rotation.x=Math.PI/2;g.add(beak,sphere(0xf0b62f,[.34,.43,.18],[-.67,.52,0]),sphere(0xf0b62f,[.34,.43,.18],[.67,.52,0]))}
      if(id==='sheep'){for(let i=0;i<9;i++){const a=i/9*Math.PI*2;g.add(sphere(0xffffff,[.34,.34,.28],[Math.cos(a)*.5,1.45+Math.sin(a)*.38,-.08]))}eyes(g,1.23,.62,.22,.09);g.add(sphere(0x8b715f,[.18,.44,.12],[-.62,1.3,.05]),sphere(0x8b715f,[.18,.44,.12],[.62,1.3,.05]))}
      if(id==='pig'){eyes(g,1.34,.54,.24,.085);g.add(cone(0xf28f9c,[-.49,1.68,0],-.45,[.8,.75,.8]),cone(0xf28f9c,[.49,1.68,0],.45,[.8,.75,.8]),sphere(0xe98291,[.32,.22,.16],[0,1.03,.62]),sphere(0x9b4e5c,[.045,.07,.04],[-.11,1.04,.78]),sphere(0x9b4e5c,[.045,.07,.04],[.11,1.04,.78]))}
      if(id==='frog'){g.children[1].scale.set(.85,.62,.7);g.add(sphere(0x88d26a,[.25,.28,.22],[-.35,1.6,.12]),sphere(0x88d26a,[.25,.28,.22],[.35,1.6,.12]));eyes(g,1.63,.22,.35,.105);g.add(sphere(0xeef4df,[.5,.12,.08],[0,1.13,.63]))}
      if(id==='rooster'){eyes(g,1.34,.54,.22,.08);const beak=cone(0xf08b32,[0,1.1,.76],0,[.8,1,.7]);beak.rotation.x=Math.PI/2;g.add(beak,sphere(0xe85043,[.19,.28,.15],[0,.88,.56]),sphere(0xe85043,[.18,.3,.13],[-.22,1.82,0]),sphere(0xe85043,[.2,.34,.13],[0,1.9,0]),sphere(0xe85043,[.18,.3,.13],[.22,1.82,0]),sphere(0xf7e6cf,[.32,.52,.18],[-.68,.62,0]),sphere(0xf7e6cf,[.32,.52,.18],[.68,.62,0]))}
      return g;
    }

    const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(38,1,.1,40);
    camera.position.set(0,2.7,7.1);camera.lookAt(0,.85,0);
    const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;mount.appendChild(renderer.domElement);
    scene.add(new THREE.HemisphereLight(0xffffff,0x69a64f,2.5));
    const light=new THREE.DirectionalLight(0xfff2cc,3);light.position.set(-4,7,5);light.castShadow=true;scene.add(light);
    const ground=new THREE.Mesh(new THREE.CylinderGeometry(3.1,3.5,.35,42),mat(0x86ce67));ground.position.y=-.35;ground.receiveShadow=true;scene.add(ground);
    let model=makeAnimal(current);scene.add(model);
    function showAnimal(id){scene.remove(model);model=makeAnimal(id);model.scale.set(.01,.01,.01);scene.add(model)}
    function resize(){const w=mount.clientWidth,h=mount.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
    new ResizeObserver(resize).observe(mount);resize();
    const clock=new THREE.Clock();
    function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime(),s=model.scale.x;model.scale.setScalar(Math.min(1,s+.075));model.position.y=Math.sin(t*2.2)*.04;model.rotation.y=Math.sin(t*.85)*.12;renderer.render(scene,camera)}
    animate();
    document.addEventListener('dblclick',event=>event.preventDefault(),{passive:false});
    document.addEventListener('gesturestart',event=>event.preventDefault(),{passive:false});
  </script>
  <script src="../../assets/home-button.js"></script>
</body>
</html>
