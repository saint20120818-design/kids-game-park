<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#7bd8e5">
  <title>小小畫家創作樂園</title>
  <style>
    :root{--ink:#315066;--blue:#67cfe4;--paper:#fffdf7;--panel:#e5fbf4f2}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{position:fixed;inset:0;width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
    body{font-family:Arial,"Noto Sans TC",sans-serif;color:var(--ink);background:#66c8dc;user-select:none;-webkit-user-select:none;touch-action:none}
    button,input{font:inherit;color:inherit}.app{position:relative;width:100%;max-width:1000px;height:100%;min-height:500px;margin:auto;overflow:hidden;background:#dff5ef;box-shadow:0 0 42px #254d6055;touch-action:none}
    header{position:absolute;z-index:20;left:0;right:0;top:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:58px;padding:calc(7px + env(safe-area-inset-top)) 10px 5px;background:linear-gradient(90deg,#68d3e4,#8fdcba);border-bottom:4px solid white;box-shadow:0 5px 15px #31576a28}
    .left,.right{display:flex;align-items:center;gap:7px}.right{justify-self:end}.title{font-size:clamp(19px,4.5vw,28px);font-weight:1000;color:white;text-shadow:0 3px 0 #3a9caf;white-space:nowrap}.head-btn{display:grid;place-items:center;min-width:42px;height:40px;padding:0 9px;border:0;border-radius:14px;background:#ffffffe8;font-size:21px;font-weight:1000;box-shadow:0 4px 0 #56a7af;cursor:pointer;touch-action:manipulation}.head-btn small{margin-left:4px;font-size:11px}.head-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #56a7af}
    .canvas-wrap{position:absolute;z-index:2;left:0;right:0;top:58px;bottom:178px;overflow:hidden;background:#c5a37e;border:10px solid #916f53;box-shadow:inset 0 0 0 4px #6d503c;touch-action:none}.canvas-wrap::before{content:"";position:absolute;inset:0;opacity:.16;pointer-events:none;background:radial-gradient(circle at 12% 23%,#fff 0 2px,transparent 3px),radial-gradient(circle at 75% 65%,#563a29 0 2px,transparent 3px);background-size:70px 65px,95px 85px}.paper{position:absolute;inset:10px;background:var(--paper);box-shadow:0 5px 13px #48352955;overflow:hidden;touch-action:none}.paper::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(#79b6a9 0.7px,transparent .8px);background-size:15px 15px}canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}.background-canvas{z-index:0;pointer-events:none}.drawing-canvas{z-index:1;cursor:crosshair}
    .symmetry-line{position:absolute;z-index:3;display:none;pointer-events:none;opacity:.32}.symmetry-line.v{top:0;bottom:0;left:50%;border-left:2px dashed #4f75a7}.symmetry-line.h{left:0;right:0;top:50%;border-top:2px dashed #4f75a7}.paper.vertical .symmetry-line.v,.paper.four .symmetry-line{display:block}
    .empty-tip{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);padding:9px 15px;border-radius:99px;background:#e7f7f4;color:#7c9c99;font-size:14px;font-weight:900;pointer-events:none;transition:opacity .25s}.empty-tip.hide{opacity:0}
    .toolbar{position:absolute;z-index:15;left:0;right:0;bottom:0;height:178px;padding:7px 9px calc(7px + env(safe-area-inset-bottom));background:var(--panel);border-top:5px solid white;box-shadow:0 -8px 24px #31576a2b;overflow:hidden;touch-action:none}.row{display:flex;align-items:center;justify-content:center;gap:5px;min-width:0}.tools{height:51px}.tool{position:relative;display:grid;place-items:center;width:clamp(39px,9.6vw,56px);height:45px;padding:0;border:0;border-radius:13px;background:#f0f4ef;font-size:24px;font-weight:1000;box-shadow:0 4px 0 #b8ccc7;cursor:pointer;touch-action:manipulation}.tool span{position:absolute;right:3px;bottom:2px;padding:1px 3px;border-radius:5px;background:#ffffffdd;font-size:8px}.tool.active{background:#fff0a2;transform:translateY(-3px);box-shadow:0 7px 0 #dab848}.tool:active{transform:translateY(2px);box-shadow:0 2px 0 #b8ccc7}.tool.danger{background:#ffe2dc}.tool:disabled{opacity:.4}
    .colors{height:45px;gap:6px}.color{width:31px;height:31px;padding:0;border:3px solid white;border-radius:50%;background:var(--c);box-shadow:0 3px 0 #9eb6b2;cursor:pointer;touch-action:manipulation}.color.active{outline:4px solid #365f75;outline-offset:1px;transform:scale(1.06)}.custom{position:relative;width:34px;height:34px;border:3px solid white;border-radius:50%;overflow:hidden;background:conic-gradient(red,#ff0,#0f0,#0ff,#00f,#f0f,red);box-shadow:0 3px 0 #9eb6b2}.custom input{position:absolute;inset:-8px;width:52px;height:52px;opacity:0;cursor:pointer}
    .options{height:53px;justify-content:space-between;padding:3px 2px 0}.size-box{display:flex;align-items:center;gap:5px;min-width:112px;padding:5px 8px;border-radius:13px;background:#ffffffaa;font-size:16px}.size-box input{width:82px;accent-color:#ff786a;touch-action:manipulation}.stamps,.mirrors{display:flex;align-items:center;gap:4px}.mini{display:grid;place-items:center;width:38px;height:38px;padding:0;border:0;border-radius:11px;background:#fff;font-size:22px;box-shadow:0 3px 0 #aec5c1;cursor:pointer;touch-action:manipulation}.mini.active{background:#ffe992;outline:3px solid #d9a72e}.mirror{font-size:16px;font-weight:1000}.group-label{font-size:10px;font-weight:1000;color:#648180;writing-mode:vertical-rl}
    .toast{position:absolute;z-index:40;left:50%;top:72px;max-width:85%;transform:translateX(-50%) translateY(-15px);padding:9px 16px;border-radius:16px;background:#31556de8;color:white;font-size:14px;font-weight:900;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translateX(-50%)}
    .dialog{position:absolute;z-index:50;inset:0;display:none;place-items:center;padding:24px;background:#31596bbb;text-align:center}.dialog.show{display:grid}.dialog-card{width:min(360px,100%);padding:24px 18px;border-radius:26px;background:#fffbed;box-shadow:0 9px 0 #287f96}.dialog-card h2{margin:0 0 7px;color:#2a8298}.dialog-card p{margin:0 0 17px;font-weight:800}.dialog-actions{display:flex;gap:10px}.dialog-actions button{flex:1;min-height:49px;border:0;border-radius:15px;font-weight:1000;cursor:pointer}.cancel{background:#e7efed}.confirm{background:#ff7d69;color:white;box-shadow:0 5px 0 #cc5749}.background-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.background-actions button{display:grid;place-items:center;gap:3px;min-height:78px;border:0;border-radius:16px;background:#e4f4ef;font-size:30px;font-weight:1000;cursor:pointer;box-shadow:0 5px 0 #accac3}.background-actions small{font-size:12px}.background-close{width:100%;min-height:44px;margin-top:14px;border:0;border-radius:14px;background:#ecefed;font-weight:1000;cursor:pointer}.file-input{position:fixed;left:-9999px;width:1px;height:1px;opacity:0}
    @media(max-width:560px){header{grid-template-columns:auto 1fr auto}.title{text-align:center}.head-btn{min-width:39px;padding:0 7px}.head-btn small{display:none}.canvas-wrap{border-width:7px}.paper{inset:7px}.options{gap:3px}.size-box{min-width:90px;padding-inline:5px}.size-box input{width:58px}.mini{width:34px;height:36px}.group-label{display:none}}
    @media(max-width:380px){.toolbar{height:170px}.canvas-wrap{bottom:170px}.tool{width:37px}.colors{gap:3px}.color{width:27px;height:27px}.mini{width:31px;font-size:19px}.size-box{min-width:78px}.size-box input{width:48px}}
    @media(max-height:620px){header{height:50px}.canvas-wrap{top:50px;bottom:151px}.toolbar{height:151px;padding-top:4px}.tools{height:43px}.tool{height:38px;font-size:21px}.colors{height:38px}.color{width:27px;height:27px}.options{height:43px}.mini{height:34px}.title{font-size:19px}}
  </style>
</head>
<body>
  <main class="app">
    <header><div class="left"><button class="head-btn home" aria-label="回到遊戲選單">⌂</button></div><div class="title">🎨 小小畫家</div><div class="right"><button class="head-btn background-picker" aria-label="選擇畫畫底圖">🖼️<small>底圖</small></button><button class="head-btn save" aria-label="儲存圖片">💾<small>儲存</small></button><button class="head-btn share" aria-label="分享圖片">↗<small>分享</small></button></div></header>
    <section class="canvas-wrap"><div class="paper"><canvas class="background-canvas" aria-hidden="true"></canvas><canvas class="drawing-canvas" aria-label="自由畫畫創作區"></canvas><i class="symmetry-line v"></i><i class="symmetry-line h"></i><div class="empty-tip">用手指在白紙上畫畫吧！</div></div></section>
    <section class="toolbar" aria-label="畫畫工具">
      <div class="row tools">
        <button class="tool active" data-tool="brush" aria-label="圓筆">🖌️<span>圓筆</span></button><button class="tool" data-tool="marker" aria-label="螢光筆">🖍️<span>彩筆</span></button><button class="tool" data-tool="spray" aria-label="噴筆">💨<span>噴筆</span></button><button class="tool" data-tool="stamp" aria-label="印章">⭐<span>印章</span></button><button class="tool" data-tool="eraser" aria-label="橡皮擦">🧼<span>擦除</span></button><button class="tool undo" aria-label="復原上一步">↶<span>復原</span></button><button class="tool danger clear" aria-label="清除畫布">🗑️<span>清除</span></button>
      </div>
      <div class="row colors" aria-label="選擇顏色"><button class="color active" style="--c:#f23b4d" data-color="#f23b4d" aria-label="紅色"></button><button class="color" style="--c:#ff762c" data-color="#ff762c" aria-label="橘色"></button><button class="color" style="--c:#ffd91f" data-color="#ffd91f" aria-label="黃色"></button><button class="color" style="--c:#70c92d" data-color="#70c92d" aria-label="綠色"></button><button class="color" style="--c:#20b9d8" data-color="#20b9d8" aria-label="藍色"></button><button class="color" style="--c:#344bb3" data-color="#344bb3" aria-label="深藍色"></button><button class="color" style="--c:#9b36bd" data-color="#9b36bd" aria-label="紫色"></button><button class="color" style="--c:#ff62ae" data-color="#ff62ae" aria-label="粉紅色"></button><button class="color" style="--c:#382b2a" data-color="#382b2a" aria-label="黑色"></button><label class="custom" aria-label="自訂顏色"><input type="color" value="#19b99a"></label></div>
      <div class="row options"><label class="size-box" aria-label="筆觸粗細">●<input class="size" type="range" min="4" max="42" value="15"></label><div class="stamps"><b class="group-label">印章</b><button class="mini active" data-stamp="⭐" aria-label="星星印章">⭐</button><button class="mini" data-stamp="💖" aria-label="愛心印章">💖</button><button class="mini" data-stamp="🌸" aria-label="花朵印章">🌸</button><button class="mini" data-stamp="🐾" aria-label="腳印印章">🐾</button></div><div class="mirrors"><b class="group-label">對稱</b><button class="mini mirror active" data-symmetry="none" aria-label="不使用對稱">無</button><button class="mini mirror" data-symmetry="vertical" aria-label="左右對稱">↔</button><button class="mini mirror" data-symmetry="four" aria-label="四向對稱">✣</button></div></div>
    </section>
    <div class="toast" role="status" aria-live="polite"></div>
    <section class="dialog" aria-modal="true" role="dialog"><div class="dialog-card"><h2>要清除全部嗎？</h2><p>畫紙會變回空白，這個動作不能復原。</p><div class="dialog-actions"><button class="cancel">先不要</button><button class="confirm">清除畫紙</button></div></div></section>
    <section class="dialog background-dialog" aria-modal="true" role="dialog"><div class="dialog-card"><h2>選擇畫畫底圖</h2><p>更換底圖會開始一張新的作品。</p><div class="background-actions"><button class="white-background">⬜<small>白色畫紙</small></button><button class="album-background">🖼️<small>從相簿選</small></button><button class="camera-background">📷<small>開啟相機</small></button></div><button class="background-close">取消</button></div></section>
    <input class="file-input album-input" type="file" accept="image/*"><input class="file-input camera-input" type="file" accept="image/*" capture="environment">
  </main>
  <script>
  (()=>{
    'use strict';
    const canvas=document.querySelector('.drawing-canvas'),ctx=canvas.getContext('2d'),backgroundCanvas=document.querySelector('.background-canvas'),backgroundCtx=backgroundCanvas.getContext('2d'),paper=document.querySelector('.paper'),tip=document.querySelector('.empty-tip'),toast=document.querySelector('.toast');
    let tool='brush',color='#f23b4d',size=15,stamp='⭐',symmetry='none',drawing=false,last=null,history=[],hasDrawing=false,lastStamp=0,backgroundImage=null;
    function resize(){const old=document.createElement('canvas');old.width=canvas.width;old.height=canvas.height;if(old.width)old.getContext('2d').drawImage(canvas,0,0);const r=paper.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=backgroundCanvas.width=Math.round(r.width*dpr);canvas.height=backgroundCanvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);backgroundCtx.setTransform(dpr,0,0,dpr,0,0);renderBackground();if(old.width)ctx.drawImage(old,0,0,old.width,old.height,0,0,r.width,r.height)}
    function renderBackground(){const r=paper.getBoundingClientRect();backgroundCtx.clearRect(0,0,r.width,r.height);backgroundCtx.fillStyle='#fffdf7';backgroundCtx.fillRect(0,0,r.width,r.height);if(!backgroundImage)return;const scale=Math.min(r.width/backgroundImage.naturalWidth,r.height/backgroundImage.naturalHeight),w=backgroundImage.naturalWidth*scale,h=backgroundImage.naturalHeight*scale;backgroundCtx.drawImage(backgroundImage,(r.width-w)/2,(r.height-h)/2,w,h)}
    new ResizeObserver(resize).observe(paper);resize();
    const pos=e=>{const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,w:r.width,h:r.height}};
    const points=p=>symmetry==='vertical'?[p,{...p,x:p.w-p.x}]:symmetry==='four'?[p,{...p,x:p.w-p.x},{...p,y:p.h-p.y},{...p,x:p.w-p.x,y:p.h-p.y}]:[p];
    function snapshot(){if(history.length>=18)history.shift();history.push(canvas.toDataURL());document.querySelector('.undo').disabled=false}
    function begin(e){e.preventDefault();snapshot();drawing=true;last=pos(e);canvas.setPointerCapture?.(e.pointerId);tip.classList.add('hide');hasDrawing=true;if(tool==='stamp')placeStamp(last);else draw(last,last)}
    function move(e){if(!drawing)return;e.preventDefault();const now=pos(e);if(tool==='stamp'){if(Date.now()-lastStamp>130)placeStamp(now)}else draw(last,now);last=now}
    function end(){drawing=false;last=null}
    function prepare(alpha=1){ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineCap='round';ctx.lineJoin='round'}
    function draw(from,to){const a=points(from),b=points(to);if(tool==='spray'){prepare(.58);b.forEach(p=>{const radius=size*1.25,count=Math.max(8,size);for(let i=0;i<count;i++){const angle=Math.random()*Math.PI*2,dist=Math.sqrt(Math.random())*radius;ctx.beginPath();ctx.arc(p.x+Math.cos(angle)*dist,p.y+Math.sin(angle)*dist,Math.max(1,size*.09),0,Math.PI*2);ctx.fill()}});ctx.globalAlpha=1;return}prepare(tool==='marker'?.28:1);ctx.lineWidth=tool==='marker'?size*1.7:size;a.forEach((p,i)=>{ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(b[i].x,b[i].y);ctx.stroke()});ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
    function placeStamp(p){lastStamp=Date.now();prepare(1);ctx.font=`${Math.max(25,size*2.4)}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';points(p).forEach(q=>ctx.fillText(stamp,q.x,q.y))}
    function restore(data){const img=new Image();img.onload=()=>{const r=canvas.getBoundingClientRect();ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.restore();ctx.drawImage(img,0,0,img.width,img.height,0,0,r.width,r.height)};img.src=data}
    function undo(){if(!history.length)return;restore(history.pop());if(!history.length){document.querySelector('.undo').disabled=true;hasDrawing=false;tip.classList.remove('hide')}}
    function clearDrawing(){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.restore();history=[];hasDrawing=false;tip.classList.remove('hide');document.querySelector('.undo').disabled=true}
    function clearAll(){clearDrawing();document.querySelector('.dialog').classList.remove('show');showToast('畫紙已經清乾淨了')}
    function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove('show'),1800)}
    function imageBlob(){const merged=document.createElement('canvas');merged.width=canvas.width;merged.height=canvas.height;const mergedCtx=merged.getContext('2d');mergedCtx.drawImage(backgroundCanvas,0,0);mergedCtx.drawImage(canvas,0,0);return new Promise(resolve=>merged.toBlob(resolve,'image/png'))}
    async function save(){const blob=await imageBlob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`小小畫家-${new Date().toISOString().slice(0,10)}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('作品已儲存成圖片！')}
    async function share(){const blob=await imageBlob(),file=new File([blob],'小小畫家.png',{type:'image/png'});if(navigator.share&&navigator.canShare?.({files:[file]})){try{await navigator.share({title:'我的畫畫作品',text:'看看我的小小畫家作品！',files:[file]});return}catch(e){if(e.name==='AbortError')return}}showToast('這個裝置不支援直接分享，已幫你儲存');save()}
    function chooseBackgroundFile(input){input.value='';input.click()}
    function loadBackground(file){if(!file)return;const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{backgroundImage=img;clearDrawing();renderBackground();tip.textContent='在照片上自由畫畫吧！';document.querySelector('.background-dialog').classList.remove('show');URL.revokeObjectURL(url);showToast('底圖已經準備好了！')};img.onerror=()=>{URL.revokeObjectURL(url);showToast('無法讀取這張圖片')};img.src=url}
    function useWhiteBackground(){backgroundImage=null;clearDrawing();renderBackground();tip.textContent='用手指在白紙上畫畫吧！';document.querySelector('.background-dialog').classList.remove('show');showToast('已換成白色畫紙')}
    canvas.addEventListener('pointerdown',begin);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
    document.querySelectorAll('.tool[data-tool]').forEach(button=>button.addEventListener('click',()=>{tool=button.dataset.tool;document.querySelectorAll('.tool[data-tool]').forEach(x=>x.classList.toggle('active',x===button))}));
    document.querySelectorAll('.color').forEach(button=>button.addEventListener('click',()=>{color=button.dataset.color;document.querySelectorAll('.color').forEach(x=>x.classList.toggle('active',x===button))}));document.querySelector('.custom input').addEventListener('input',e=>{color=e.target.value;document.querySelectorAll('.color').forEach(x=>x.classList.remove('active'))});
    document.querySelector('.size').addEventListener('input',e=>size=+e.target.value);document.querySelectorAll('[data-stamp]').forEach(button=>button.addEventListener('click',()=>{stamp=button.dataset.stamp;tool='stamp';document.querySelectorAll('[data-stamp]').forEach(x=>x.classList.toggle('active',x===button));document.querySelectorAll('.tool[data-tool]').forEach(x=>x.classList.toggle('active',x.dataset.tool==='stamp'))}));
    document.querySelectorAll('[data-symmetry]').forEach(button=>button.addEventListener('click',()=>{symmetry=button.dataset.symmetry;paper.className=`paper ${symmetry}`;document.querySelectorAll('[data-symmetry]').forEach(x=>x.classList.toggle('active',x===button))}));
    document.querySelector('.undo').addEventListener('click',undo);document.querySelector('.undo').disabled=true;document.querySelector('.clear').addEventListener('click',()=>document.querySelector('.dialog').classList.add('show'));document.querySelector('.cancel').addEventListener('click',()=>document.querySelector('.dialog').classList.remove('show'));document.querySelector('.confirm').addEventListener('click',clearAll);document.querySelector('.save').addEventListener('click',save);document.querySelector('.share').addEventListener('click',share);
    const backgroundDialog=document.querySelector('.background-dialog'),albumInput=document.querySelector('.album-input'),cameraInput=document.querySelector('.camera-input');document.querySelector('.background-picker').addEventListener('click',()=>backgroundDialog.classList.add('show'));document.querySelector('.background-close').addEventListener('click',()=>backgroundDialog.classList.remove('show'));document.querySelector('.white-background').addEventListener('click',useWhiteBackground);document.querySelector('.album-background').addEventListener('click',()=>chooseBackgroundFile(albumInput));document.querySelector('.camera-background').addEventListener('click',()=>chooseBackgroundFile(cameraInput));albumInput.addEventListener('change',e=>loadBackground(e.target.files[0]));cameraInput.addEventListener('change',e=>loadBackground(e.target.files[0]));
    document.querySelector('.home').addEventListener('click',()=>{if(location.protocol!=='file:')location.href='../../';else if(document.referrer)window.history.back();else location.href='https://saint20120818-design.github.io/kids-game-park/'});
    ['gesturestart','gesturechange','gestureend'].forEach(type=>document.addEventListener(type,e=>e.preventDefault(),{passive:false}));document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
  })();
  </script>
</body>
</html>
