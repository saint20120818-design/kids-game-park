<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#79d9ee">
  <meta name="description" content="為幼兒設計的簡單、友善、沒有失敗壓力的小遊戲樂園。">
  <meta property="og:title" content="小小遊戲樂園">
  <meta property="og:description" content="點一下，開始玩！適合幼兒的手機小遊戲。">
  <meta property="og:image" content="assets/og.png">
  <title>小小遊戲樂園</title>
  <style>
    :root{--ink:#29445a;--sky:#83daf1;--cream:#fff9e9}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html{background:#79cfe9;scroll-behavior:smooth}
    body{min-height:100%;margin:0;overflow-x:hidden;background:linear-gradient(#83daf1 0 310px,#fdf6df 310px);color:var(--ink);font-family:Arial,"Noto Sans TC",sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior-y:none}
    button,a{font:inherit;color:inherit}
    .hero{position:relative;min-height:306px;padding:calc(24px + env(safe-area-inset-top)) 20px 68px;text-align:center;overflow:hidden}
    .sun{position:absolute;right:5%;top:70px;width:78px;height:78px;border-radius:50%;background:#ffe56d;box-shadow:0 0 0 13px #ffe56d44}
    .cloud{position:absolute;width:110px;height:32px;border-radius:50px;background:#fff9}.cloud:before,.cloud:after{content:"";position:absolute;bottom:0;border-radius:50%;background:inherit}.cloud:before{left:17px;width:48px;height:48px}.cloud:after{right:13px;width:59px;height:59px}.c1{top:78px;left:-18px}.c2{top:180px;right:-20px;transform:scale(.65)}
    .sound-toggle{position:absolute;z-index:4;top:calc(16px + env(safe-area-inset-top));right:16px;width:48px;height:48px;border:3px solid white;border-radius:50%;background:#ffffffdd;font-size:23px;box-shadow:0 5px 0 #46a9c1;cursor:pointer;touch-action:manipulation}
    .mascot{position:relative;z-index:2;display:inline-grid;place-items:center;width:84px;height:84px;border:6px solid white;border-radius:28px;background:#ff8a70;font-size:51px;box-shadow:0 9px 0 #d85d4d;transform:rotate(-4deg);animation:float 2.2s ease-in-out infinite alternate}
    h1{position:relative;z-index:2;margin:17px 0 5px;color:white;font-size:clamp(36px,10vw,58px);line-height:1;text-shadow:0 5px 0 #3997ae;letter-spacing:-.05em}
    .hero p{position:relative;z-index:2;display:inline-block;margin:9px 0;padding:8px 17px;border-radius:99px;background:#ffffffdd;color:#327d92;font-size:15px;font-weight:900;box-shadow:0 4px 0 #46a9c1}
    .hill{position:absolute;left:-10%;right:-10%;bottom:-50px;height:115px;border-radius:50% 50% 0 0;background:#86d36b}.hill:after{content:"";position:absolute;left:38%;bottom:14px;width:160px;height:80px;border-radius:50% 50% 0 0;background:#72c05b}
    .content{position:relative;z-index:3;width:min(920px,100%);margin:-20px auto 0;padding:0 14px calc(34px + env(safe-area-inset-bottom))}
    .section-title{display:flex;align-items:center;gap:9px;margin:0 7px 14px;font-size:20px;font-weight:1000}.section-title:after{content:"";height:4px;flex:1;border-radius:5px;background:#e6dcae}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
    .game-card{position:relative;display:flex;min-height:180px;padding:14px;overflow:hidden;border:4px solid white;border-radius:27px;background:var(--card);text-decoration:none;box-shadow:0 8px 0 var(--shadow),0 13px 22px #52645b1a;transition:transform .15s;touch-action:manipulation}
    .game-card:active{transform:translateY(6px) scale(.98);box-shadow:0 2px 0 var(--shadow)}
    .game-card:focus-visible{outline:6px solid #2a69d8;outline-offset:3px}
    .card-copy{position:relative;z-index:2;align-self:flex-end;text-align:left}.game-card h2{margin:0 0 2px;font-size:clamp(19px,5.4vw,25px);line-height:1.08}.game-card p{margin:0;font-size:12px;font-weight:800;opacity:.72}
    .icon{position:absolute;top:8px;right:8px;display:grid;place-items:center;width:88px;height:88px;border-radius:50%;background:#ffffff77;font-size:55px;filter:drop-shadow(0 5px 0 #0001);transform:rotate(5deg)}
    .play{position:absolute;right:12px;bottom:11px;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:white;color:#4d6575;font-size:17px;box-shadow:0 3px 0 #0002}
    .new:before{content:"NEW";position:absolute;z-index:3;top:10px;left:-31px;width:100px;padding:4px 0;background:#ff695e;color:white;font-size:10px;font-weight:1000;text-align:center;transform:rotate(-42deg)}
    footer{padding:25px 15px 12px;text-align:center;color:#8a846e;font-size:13px;font-weight:800}
    @keyframes float{to{transform:translateY(-9px) rotate(4deg)}}
    @media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.game-card{min-height:205px}.content{margin-top:-10px}}
    @media(max-height:620px){.hero{min-height:255px;padding-top:18px}.mascot{width:66px;height:66px;font-size:40px}h1{font-size:36px}.content{margin-top:-32px}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <header class="hero">
    <div class="cloud c1" aria-hidden="true"></div><div class="cloud c2" aria-hidden="true"></div><div class="sun" aria-hidden="true"></div>
    <button class="sound-toggle" aria-label="關閉語音提示">🔊</button>
    <div class="mascot" aria-hidden="true">🎮</div>
    <h1>小小遊戲樂園</h1>
    <p>點一個喜歡的遊戲，開始玩！</p>
    <div class="hill" aria-hidden="true"></div>
  </header>
  <main class="content">
    <div class="section-title"><span>✨</span>選一個來玩</div>
    <div class="grid">
      <a class="game-card new" style="--card:#bdeef3;--shadow:#74c5ce" href="games/bath-time/" data-name="洗澡時間"><span class="icon">🛁</span><div class="card-copy"><h2>洗澡時間</h2><p>幫小狗洗香香</p></div><i class="play">▶</i></a>
      <a class="game-card new" style="--card:#ffe19a;--shadow:#e3b650" href="games/animal-sounds/" data-name="動物聲音島"><span class="icon">🐶</span><div class="card-copy"><h2>動物聲音島</h2><p>聽聽是誰在叫</p></div><i class="play">▶</i></a>
      <a class="game-card" style="--card:#c8edab;--shadow:#8ec668" href="games/train-passengers/" data-name="歡樂載客小火車"><span class="icon">🚂</span><div class="card-copy"><h2>載客小火車</h2><p>幫乘客找到座位</p></div><i class="play">▶</i></a>
      <a class="game-card" style="--card:#ffc4b5;--shadow:#df8976" href="games/claw-capsule/" data-name="扭蛋夾夾樂"><span class="icon">🕹️</span><div class="card-copy"><h2>扭蛋夾夾樂</h2><p>看看夾到什麼</p></div><i class="play">▶</i></a>
      <a class="game-card" style="--card:#d5c7f3;--shadow:#9e89cf" href="games/puzzle/" data-name="小小畫家拼圖"><span class="icon">🧩</span><div class="card-copy"><h2>小小畫家拼圖</h2><p>拼出可愛圖畫</p></div><i class="play">▶</i></a>
      <a class="game-card" style="--card:#baddfa;--shadow:#75aed6" href="games/shape-match/" data-name="形狀配對"><span class="icon">🔷</span><div class="card-copy"><h2>形狀配對</h2><p>幫形狀找到家</p></div><i class="play">▶</i></a>
      <a class="game-card" style="--card:#ffce81;--shadow:#dc9e42" href="games/color-match/" data-name="企鵝冰棒配對"><span class="icon">🐧</span><div class="card-copy"><h2>企鵝冰棒配對</h2><p>找出相同顏色</p></div><i class="play">▶</i></a>
      <a class="game-card" style="--card:#c4efca;--shadow:#80c08a" href="games/animal-match/" data-name="動物卡牌配對"><span class="icon">🦁</span><div class="card-copy"><h2>動物卡牌配對</h2><p>翻出一樣的動物</p></div><i class="play">▶</i></a>
      <a class="game-card" style="--card:#e6e7eb;--shadow:#aaadb6" href="games/card-sequence/" data-name="顏色順序挑戰"><span class="icon">🃏</span><div class="card-copy"><h2>顏色順序挑戰</h2><p>排出正確順序</p></div><i class="play">▶</i></a>
    </div>
    <footer>給小朋友的安全遊戲空間・沒有廣告・沒有失敗壓力</footer>
  </main>
  <script>
    let voiceOn=true;
    const toggle=document.querySelector('.sound-toggle');
    toggle.addEventListener('click',()=>{voiceOn=!voiceOn;toggle.textContent=voiceOn?'🔊':'🔇';toggle.setAttribute('aria-label',voiceOn?'關閉語音提示':'開啟語音提示');if(!voiceOn)speechSynthesis.cancel()});
    document.querySelectorAll('.game-card').forEach(card=>{
      card.addEventListener('click',event=>{
        if(!voiceOn)return;
        event.preventDefault();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(card.dataset.name);u.lang='zh-TW';u.rate=.85;speechSynthesis.speak(u);card.style.transform='translateY(6px) scale(.98)';setTimeout(()=>location.href=card.href,380);
      });
    });
    document.addEventListener('dblclick',event=>event.preventDefault(),{passive:false});
    document.addEventListener('gesturestart',event=>event.preventDefault(),{passive:false});
  </script>
</body>
</html>
